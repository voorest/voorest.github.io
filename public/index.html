<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mafia BCN — Game Log</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0e0f11">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard"><span class="logo">♠</span> Mafia <b>BCN</b></a>
    <nav id="nav">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/games" data-route="games">Games</a>
      <a href="#/players" data-route="players">Players</a>
      <a href="#/data" data-route="data" data-admin hidden>Data</a>
      <a href="#/settings" data-route="settings" data-admin hidden>Settings</a>
      <a href="#/bot" data-route="bot" data-admin-live hidden>Bot</a>
      <a href="#/me" data-route="me" id="navMe" hidden>My stats</a>
    </nav>
    <div class="spacer"></div>
    <span id="saveState" class="save-state" aria-live="polite"></span>
    <div id="auth" class="auth"></div>
  </header>
  <div id="banner"></div>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Plain scripts (no build step) so the site also works by double-clicking index.html -->
  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
